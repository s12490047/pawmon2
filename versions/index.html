<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pawmon 風格總覽 — 台灣浪浪探索圖鑑</title>
<meta name="description" content="Pawmon 台灣浪浪探索圖鑑的三套全站風格版本：田野圖鑑、六都海報、卡牌收藏冊。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f2f0e9;--ink:#181816;--muted:#5c5a54;--paper:#fff;--line:#181816;--field:#d9d6cc}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",sans-serif;font-size:17px;line-height:1.65}
  .wrap{width:min(1100px,calc(100% - 40px));margin-inline:auto}
  header{padding:64px 0 32px}
  h1{font-family:"Noto Serif TC",serif;font-size:clamp(40px,6vw,76px);font-weight:600;line-height:1.05;letter-spacing:-.03em;margin:0 0 14px}
  header p{max-width:44ch;color:var(--muted);margin:0}
  main{padding-bottom:72px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  a.card{display:flex;flex-direction:column;min-height:280px;padding:24px;background:var(--paper);color:var(--ink);text-decoration:none;transition:background .18s}
  a.card:hover{background:var(--field)}
  .card:nth-child(1){background:#fff}
  .card:nth-child(2){background:#e6e0d2}
  .card:nth-child(3){background:#e9e2d3}
  .card b{font-family:"Noto Serif TC",serif;font-size:28px;line-height:1.2;margin-bottom:8px}
  .card span{font-size:14px;color:var(--muted)}
  .card p{margin:auto 0 0;font-size:16px}
  .card em{font-style:normal;font-size:13px;margin-top:16px;text-decoration:underline;text-underline-offset:3px}
  footer{padding:24px 0 48px;color:var(--muted);font-size:14px}
  footer a{color:var(--ink)}
  @media(max-width:820px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="wrap">
  <h1>Pawmon<br>三種風格版本</h1>
  <p>同一個世界觀、同一套功能，三種完整的視覺語言。三頁共用 <code>assets/app.js</code>，收藏與新增資料也會互通。</p>
</header>
<main class="wrap">
  <div class="grid">
    <a class="card" href="field-guide.html">
      <b>田野圖鑑</b>
      <span>Field Guide</span>
      <p>自然史標本冊的語氣：骨白紙面、襯線字、灰綠與亮橘的分類色塊，適合慢慢閱讀。</p>
      <em>打開田野圖鑑</em>
    </a>
    <a class="card" href="city-chapters.html">
      <b>六都海報</b>
      <span>Colour Chapters</span>
      <p>六座城市就是六個色彩章節：大寫標題、滿版色塊、照片拼貼，節奏最快、最像展覽。</p>
      <em>打開六都海報</em>
    </a>
    <a class="card" href="card-binder.html">
      <b>卡牌收藏冊</b>
      <span>Card Binder</span>
      <p>把網站做成一本文具店裡的收藏冊：深綠封皮、骨白紙頁、金色書籤與透明卡套。</p>
      <em>打開收藏冊</em>
    </a>
  </div>
</main>
<footer class="wrap">
  <p>課程專題 Demo。內建角色為虛構示範資料；<a href="../index.html">回到原始版本</a>。</p>
</footer>
</body>
</html>
